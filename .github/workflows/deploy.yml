name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Update SW cache version
        run: |
          BUILD_VER=$(date -u +%Y%m%d%H%M%S)
          sed -i "s/pachislot-tool-cache-[^']*/pachislot-tool-cache-${BUILD_VER}/" public/sw.js
          echo "SW cache version: pachislot-tool-cache-${BUILD_VER}"

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
